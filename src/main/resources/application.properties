spring.application.name=financial-planner
server.port=8080

# Database configuration (Defaults to embedded persistent H2 database so it runs immediately out-of-the-box)
# To use PostgreSQL: set environment variables or change properties:
#   DB_URL=jdbc:postgresql://localhost:5432/financial_planner
#   DB_USERNAME=postgres
#   DB_PASSWORD=postgres
#   DB_DRIVER=org.postgresql.Driver
# To use MySQL:
#   DB_URL=jdbc:mysql://localhost:3306/financial_planner?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
#   DB_USERNAME=root
#   DB_PASSWORD=root
#   DB_DRIVER=com.mysql.cj.jdbc.Driver

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/finplanner;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false

app.default.admin.username=${APP_ADMIN_USERNAME:admin}
app.default.admin.password=${APP_ADMIN_PASSWORD:admin123}
app.default.admin.email=${APP_ADMIN_EMAIL:admin@finplanner.local}
app.default.admin.fullName=${APP_ADMIN_FULLNAME:System Administrator}
